<nav class="site-nav">
  <input type="checkbox" id="site-nav-toggle" aria-label="Menu" class="site-nav-toggle" />
  <label for="site-nav-toggle" class="site-nav-toggle-button">
    <span class="sr-only">Menu</span>
    <span class="icon icon--bars"></span>
    <span class="icon icon--close"></span>
  </label>
  <div class="site-nav__inner">
    <ul class="site-nav__items">
      {% include nav.html %}

      <!-- Language Switcher -->
      {% if site.languages.size > 1 %}
      <li class="site-nav__item language-switcher-item">
        <select class="language-selector" onchange="window.location.href = this.value">
          {% assign current_lang = page.lang | default: site.default_lang %}
          {% for lang in site.languages %}
            <!-- Simple URL construction: /base/en/post -> /base/es/post -->
            {% assign url_parts = page.url | split: '/' %}
            {% assign new_url = "" %}
            {% for part in url_parts %}
              {% if part == current_lang and forloop.index == 1 %}
                {% assign new_url = new_url | append: '/' | append: lang %}
              {% else %}
                {% assign new_url = new_url | append: '/' | append: part %}
              {% endif %}
            {% endfor %}
            {% assign new_url = new_url | remove_first: '/' %}
            
            <option value="{{ site.baseurl }}/{{ new_url }}" {% if lang == current_lang %}selected{% endif %}>
              {{ lang | upcase }}
            </option>
          {% endfor %}
        </select>
      </li>
      {% endif %}
      <!-- End Language Switcher -->
      
    </ul>
  </div>
  <!-- DEBUG: Remove this later -->
<div style="background: yellow; padding: 10px; border: 2px solid red;">
  Languages count: {{ site.languages.size }}
  Languages list: {{ site.languages | join: ", " }}
  Default lang: {{ site.default_lang }}
  Current page lang: {{ page.lang }}
</div>
</nav>
